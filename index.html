<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembiayaan Peribadi</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{

background:#7a1026;
color:white;
padding:60px 20px;
text-align:center;

}

header h1{

font-size:34px;

}

header p{

margin-top:15px;
font-size:18px;

}

.container{

width:90%;
max-width:1100px;
margin:auto;

}

.card{

background:white;
padding:25px;
margin-top:30px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);

}

input,select{

width:100%;
padding:15px;
margin-top:12px;
border:1px solid #ddd;
border-radius:8px;

}

button{

width:100%;
padding:16px;
background:#25D366;
border:none;
color:white;
font-size:18px;
border-radius:8px;
margin-top:20px;
cursor:pointer;

}

button:hover{

background:#20ba5a;

}

footer{

text-align:center;
padding:30px;

}

</style>

</head>

<body>

<header>

<h1>Pembiayaan Peribadi</h1>

<p>Semak Kelayakan Anda Secara Percuma</p>

</header>

<div class="container">

<div class="card">

<h2>Semakan Kelayakan Percuma</h2>

<input type="text" id="nama" placeholder="Nama Penuh">

<input type="number" id="umur" placeholder="Umur">

<select id="sektor" onchange="toggleCompany()">
    <option value="">-- Pilih Sektor --</option>
    <option value="Kerajaan">Kerajaan</option>
    <option value="GLC">GLC</option>
    <option value="Swasta">Swasta</option>
</select>

<div id="companyDiv" style="display:none;">
    <input type="text" id="company" placeholder="Nama Syarikat">
</div>

<input type="number" id="gaji" placeholder="Gaji Pokok + Elaun Tetap (RM)">

<select id="status">
    <option value="">-- Status Pekerjaan --</option>
    <option>Permanent & Confirm</option>
    <option>Kontrak</option>
</select>

<input type="text" id="tempoh" placeholder="Tempoh Berkhidmat (Contoh: 3 Tahun 2 Bulan)">

<button onclick="ws()">
SEMAK KELAYAKAN SEKARANG
</button>

</div>

</body>
</html>
<script>

function toggleCompany(){

let sektor=document.getElementById("sektor").value;

if(sektor=="Swasta" || sektor=="GLC"){

document.getElementById("companyDiv").style.display="block";

}else{

document.getElementById("companyDiv").style.display="none";

}

}

function ws(){

let nama=document.getElementById("nama").value;

let umur=document.getElementById("umur").value;

let sektor=document.getElementById("sektor").value;

let company=document.getElementById("company").value;

let gaji=document.getElementById("gaji").value;

let status=document.getElementById("status").value;

let tempoh=document.getElementById("tempoh").value;

let text=
`Salam / Hai,

Saya nak semak kelayakan Pembiayaan Peribadi.

Maklumat Saya:

Nama : ${nama}
Umur : ${umur}
Sektor : ${sektor}`;

if(sektor=="Swasta" || sektor=="GLC"){
text += `\nNama Syarikat : ${company}`;
}

text += `

Gaji : RM${gaji}
Status Pekerjaan : ${status}
Tempoh Berkhidmat : ${tempoh}

Mohon bantu semak kelayakan saya.

Terima kasih.`;

window.open("https://wa.me/60134300057?text="+encodeURIComponent(text));

}

</script>
