<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembiayaan Peribadi</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{

background:#7a1026;
color:white;
padding:60px 20px;
text-align:center;

}

header h1{

font-size:34px;

}

header p{

margin-top:15px;
font-size:18px;

}

.container{

width:90%;
max-width:1100px;
margin:auto;

}

.card{

background:white;
padding:25px;
margin-top:30px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);

}

input,select{

width:100%;
padding:15px;
margin-top:12px;
border:1px solid #ddd;
border-radius:8px;

}

button{

width:100%;
padding:16px;
background:#25D366;
border:none;
color:white;
font-size:18px;
border-radius:8px;
margin-top:20px;
cursor:pointer;

}

button:hover{

background:#20ba5a;

}

footer{

text-align:center;
padding:30px;

}

</style>

</head>

<body>

<header>

<h1>Pembiayaan Peribadi</h1>

<p>Semak Kelayakan Anda Secara Percuma</p>

</header>

<div class="container">

<div class="card">

<h2>Semakan Kelayakan</h2>

<input id="nama" placeholder="Nama">

<select id="sektor">

<option>Kerajaan</option>

<option>Swasta</option>

<option>GLC</option>

</select>

<input id="gaji" placeholder="Gaji Bulanan">

<input id="jumlah" placeholder="Jumlah Pembiayaan">

<button onclick="ws()">

SEMAK KELAYAKAN

</button>

</div>

</div>

<footer>

©2026 Personal Financing

</footer>

<script>

function ws(){

let nama=document.getElementById("nama").value;

let sektor=document.getElementById("sektor").value;

let gaji=document.getElementById("gaji").value;

let jumlah=document.getElementById("jumlah").value;

let text=`Salam / Hai,

Saya nak semak kelayakan Pembiayaan Peribadi.

Maklumat Saya:

Nama : ${nama}

Sektor : ${sektor}

Gaji : RM${gaji}

Jumlah Pembiayaan : RM${jumlah}

Mohon bantu semak kelayakan saya.

Terima kasih.`;

window.open("https://wa.me/60134300057?text="+encodeURIComponent(text));

}

</script>

</body>
</html>
